<div class="min-h-screen flex flex-col lg:flex-row" style="background-color: #132137;">
  <section class="relative w-full lg:w-1/2 h-48 sm:h-64 lg:h-screen flex-shrink-0 order-2 lg:order-1 overflow-hidden">
    <div class="absolute inset-0 bg-center bg-no-repeat" style="background-image:url('/banner/banner.png'); background-size: contain;">
    </div>
  </section>

  <section
    class="w-full lg:w-1/2 flex flex-col items-center justify-center p-4 sm:p-6 md:p-8 order-1 lg:order-2 min-h-screen lg:min-h-0 bg-white">
    <div class="mb-6 text-center">
      <h2 class="text-xl md:text-2xl font-bold text-[#040E1C] mb-1">Iniciar Sesión</h2>
      <p class="text-gray-600 text-sm">Ingresa tus credenciales para continuar</p>
    </div>

    <div class="w-full max-w-sm">
      <div class="bg-white border border-gray-200 rounded-xl p-6 shadow-lg">
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-4">
          <div *ngIf="errorMessage" class="mb-3 p-2 bg-red-50 border border-red-200 rounded text-red-700 text-xs">
            {{ errorMessage }}
          </div>

          <div>
            <label for="email" class="block text-sm font-medium text-[#040E1C] mb-2">Correo electrónico</label>
            <input id="email" name="email" type="email" formControlName="email"
              class="w-full px-3 py-3 rounded-lg bg-white text-[#040E1C] placeholder-gray-500 border border-[#040E1C] focus:outline-none focus:ring-2 focus:ring-[#132137] focus:border-[#040E1C] transition-all duration-300 text-sm"
              placeholder="email">
          </div>

          <div>
            <label for="password" class="block text-sm font-medium text-[#040E1C] mb-2">Contraseña</label>
            <div class="relative">
              <input id="password" name="password" [type]="showPassword ? 'text' : 'password'" formControlName="password"
                class="w-full px-3 py-3 pr-12 rounded-lg bg-white text-[#040E1C] placeholder-gray-500 border border-[#040E1C] focus:outline-none focus:ring-2 focus:ring-[#132137] focus:border-[#040E1C] transition-all duration-300 text-sm"
                placeholder="••••••••">
              <button type="button" (click)="togglePasswordVisibility()"
                class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 hover:text-[#132137] transition-colors duration-200 focus:outline-none">
                <svg *ngIf="!showPassword" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
                  <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
                <svg *ngIf="showPassword" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />
                </svg>
              </button>
            </div>
          </div>

          <div class="flex items-center justify-between text-xs">
            <div class="flex items-center">
              <input id="remember" name="remember" type="checkbox"
                class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-[#040E1C] rounded bg-white cursor-pointer">
              <label for="remember" class="ml-2 text-gray-600 cursor-pointer">Recordarme</label>
            </div>
            <a href="#" class="text-[#132137] hover:text-[#040E1C] transition-colors duration-200 hover:underline cursor-pointer">
              ¿Olvidaste tu contraseña?
            </a>
          </div>

          <button type="submit" [disabled]="isLoading"
            [class]="'w-full py-3 rounded-lg font-semibold focus:outline-none focus:ring-2 focus:ring-[#132137] focus:ring-offset-2 transition-all duration-300 text-sm shadow-lg ' +
            (isLoading
              ? 'bg-gray-400 border-gray-400 text-gray-200 cursor-not-allowed'
              : 'bg-[#132137] border border-[#040E1C] text-white hover:bg-[#040E1C] hover:border-[#132137] transform hover:scale-[1.02] active:scale-95')">
            <span *ngIf="!isLoading">Iniciar sesión</span>
            <span *ngIf="isLoading">Cargando...</span>
          </button>
        </form>

        <div class="relative my-4">
          <div class="absolute inset-0 flex items-center">
            <div class="w-full border-t border-gray-200"></div>
          </div>
          <div class="relative flex justify-center text-xs">
            <span class="px-3 text-gray-500 bg-white">O</span>
          </div>
        </div>

        <!-- ✅ SECCIÓN CORREGIDA -->
        <div class="text-center space-y-2">
          <p class="text-sm text-gray-600">
            ¿No tienes cuenta?
            <a routerLink="../register"
              class="ml-1 text-[#132137] hover:text-[#040E1C] font-medium transition-colors duration-200 hover:underline cursor-pointer">
              Registrar empresa
            </a>
          </p>
          <p class="text-xs text-gray-600">
            ¿Necesitas ayuda?
            <a href="#"
              class="ml-1 text-[#132137] hover:text-[#040E1C] font-medium transition-colors duration-200 hover:underline cursor-pointer">
              Contáctanos
            </a>
          </p>
        </div>
      </div>
    </div>

    <footer class="mt-6">
      <p class="text-xs text-gray-500 text-center">
        © 2024 <span class="text-[#132137] font-medium">Ubicate - Marketing y Software S.A.C.</span>
      </p>
    </footer>
  </section>
</div>
