<app-slidebard [isOpen]="sidebarOpen" (logout)="onLogout()" (toggleChange)="onSidebarToggle($event)" (showTourRequest)="startTour()">
</app-slidebard>

<!-- Senal Notification Toast -->
<app-senal-notification
  *ngIf="showNotification && currentNotification"
  [notification]="currentNotification"
  [show]="showNotification"
  (closed)="onNotificationClosed()">
</app-senal-notification>

<!-- Onboarding Tour -->
<app-onboarding-tour 
  *ngIf="showTour"
  [steps]="tourSteps"
  (tourComplete)="onTourComplete()"
  (tourSkipped)="onTourSkipped()">
</app-onboarding-tour>

<!-- Accessibility Controls -->
<app-accessibility-controls></app-accessibility-controls>

<div class="h-screen overflow-hidden" 
     [ngClass]="sidebarOpen ? 'ml-64' : 'ml-16'"
     style="transition: margin-left 0.3s cubic-bezier(0.4, 0, 0.2, 1);">

  <!-- <app-navbard (menuToggle)="toggleSidebar()"></app-navbard> -->

  <main class="p-6 bg-gray-50 dark:bg-gray-900 h-full overflow-y-auto transition-colors duration-300">
    <div [@fadeAnimation]="getRouteAnimationData()" class="h-full">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
