<div
  class="fixed top-0 left-0 h-screen bg-gradient-to-b from-[#040E1C] to-[#021133] shadow-xl z-40 transition-all duration-300"
  [ngClass]="isOpen ? 'w-64' : 'w-16'">

  <div class="flex flex-col h-full">

    <!-- Toggle Button -->
    <div class="p-4 border-b border-white/10 flex items-center" [ngClass]="isOpen ? 'justify-between' : 'justify-center'">
      <button (click)="toggleSidebar()"
        class="p-2 text-slate-100 hover:bg-white/10 rounded-lg transition-colors duration-200"
        [title]="isOpen ? 'Cerrar menú' : 'Abrir menú'">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      </button>
      
      <!-- Botón verde - visible cuando está expandido -->
      <button *ngIf="isOpen" (click)="showGreenTip()"
        class="p-2 text-green-400 hover:bg-white/10 rounded-lg transition-colors duration-200 flex items-center space-x-1"
        title="Consejos de Sostenibilidad">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <span class="text-xs">🌱</span>
      </button>
    </div>

    <!-- Company Header -->
    <div class="p-4 border-b border-white/10" *ngIf="isOpen">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-lg bg-white/10 flex items-center justify-center">
          <span class="text-white font-bold text-lg">{{ empresaNombre ? empresaNombre.charAt(0).toUpperCase() : 'M'
            }}</span>
        </div>
        <div>
          <h3 class="text-slate-100 font-semibold">{{ empresaNombre || 'Mi Empresa' }}</h3>
        </div>
      </div>
    </div>

    <!-- Company Header Collapsed -->
    <div class="p-4 border-b border-white/10" *ngIf="!isOpen">
      <div class="w-8 h-8 rounded-lg bg-white/10 flex items-center justify-center mx-auto">
        <span class="text-white font-bold">{{ empresaNombre ? empresaNombre.charAt(0).toUpperCase() : 'M' }}</span>
      </div>
    </div>

    <!-- Botón verde - visible cuando está colapsado -->
    <div class="p-2 border-b border-white/10 flex justify-center" *ngIf="!isOpen">
      <button (click)="showGreenTip()"
        class="p-2 text-green-400 hover:bg-white/10 rounded-lg transition-colors duration-200"
        title="Consejos de Sostenibilidad">
        <span class="text-lg">🌱</span>
      </button>
    </div>

    <!-- Navigation Menu -->
    <div class="flex-1 overflow-y-auto p-2">
      <nav class="space-y-1">
        <div *ngFor="let item of menuItems; trackBy: trackByFn">
          <button (click)="onItemClick(item.id)"
            class="w-full flex items-center px-3 py-3 text-sm font-medium rounded-lg transition-all duration-200"
            [ngClass]="{
              'bg-white/10 text-slate-100 shadow-inner ring-1 ring-white/10': activeItem === item.id,
              'text-slate-300 hover:bg-white/5 hover:text-slate-100': activeItem !== item.id,
              'justify-center': !isOpen,
              'justify-start space-x-3': isOpen
            }">

            <!-- Icons -->
            <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <!-- Dashboard/Home -->
              <path *ngIf="item.icon === 'home'" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
              <polyline *ngIf="item.icon === 'home'" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                points="9,22 9,12 15,12 15,22" />

              <!-- Users -->
              <path *ngIf="item.icon === 'user'" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
              <circle *ngIf="item.icon === 'user'" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                cx="12" cy="7" r="4" />

              <!-- Bus -->
              <rect *ngIf="item.icon === 'bus'" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" x="3"
                y="6" width="18" height="10" rx="2" />
              <circle *ngIf="item.icon === 'bus'" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" cx="8"
                cy="19" r="2" />
              <circle *ngIf="item.icon === 'bus'" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                cx="16" cy="19" r="2" />
              <path *ngIf="item.icon === 'bus'" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M3 12h18M8 6v6M16 6v6" />

              <!-- Settings -->
              <circle *ngIf="item.icon === 'settings'" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                cx="12" cy="12" r="3" />
              <path *ngIf="item.icon === 'settings'" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="m12 1 1.5 1.5M21 12l-1.5 1.5M12 23l-1.5-1.5M3 12l1.5-1.5" />
              <path *ngIf="item.icon === 'settings'" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="m18.4 6.6-.9.9M6.6 18.4l-.9.9M17.5 17.5l-.9-.9M6.5 6.5l-.9-.9" />
            </svg>

            <span *ngIf="isOpen" class="truncate">{{ item.name }}</span>
          </button>
        </div>
      </nav>
    </div>



    <!-- User Profile & Logout -->
    <div class="p-4 border-t border-white/10" *ngIf="isOpen">


      <button (click)="onLogout()"
        class="w-full flex items-center justify-center space-x-2 px-4 py-2.5 bg-white/10 hover:bg-white/15 text-slate-100 rounded-lg transition-colors duration-200 ring-1 ring-white/10">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
          <polyline stroke-linecap="round" stroke-linejoin="round" stroke-width="2" points="16,17 21,12 16,7" />
          <line stroke-linecap="round" stroke-linejoin="round" stroke-width="2" x1="21" y1="12" x2="9" y2="12" />
        </svg>
        <span class="text-sm font-medium">Cerrar Sesión</span>
      </button>
    </div>

    <!-- User Profile Collapsed -->
    <div class="p-3 border-t border-white/10" *ngIf="!isOpen">
      <div class="flex flex-col items-center space-y-3">
        <button (click)="onLogout()"
          class="w-8 h-8 rounded-lg bg-white/10 hover:bg-white/15 flex items-center justify-center transition-colors duration-200"
          title="Cerrar Sesión">
          <svg class="w-4 h-4 text-slate-100" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
            <polyline stroke-linecap="round" stroke-linejoin="round" stroke-width="2" points="16,17 21,12 16,7" />
            <line stroke-linecap="round" stroke-linejoin="round" stroke-width="2" x1="21" y1="12" x2="9" y2="12" />
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Notificación Verde -->
  <app-green-notification *ngIf="currentGreenTip" [tip]="currentGreenTip" [show]="showGreenNotification"
    (closed)="onGreenNotificationClosed()" (learnMoreClicked)="onLearnMoreClicked($event)"
    [ngClass]="isOpen ? 'left-72' : 'left-20'"
    class="fixed top-4 z-50 transition-all duration-300">
  </app-green-notification>
</div>
