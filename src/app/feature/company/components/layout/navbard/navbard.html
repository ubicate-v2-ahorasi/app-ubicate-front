<nav class="h-16 flex items-center justify-between px-4 bg-white shadow-lg relative">
  <button (click)="onMenuClick()"
    class="p-2.5 text-[#021133] hover:bg-[#040E1C]/70 rounded-lg transition-colors duration-200">
    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
    </svg>
  </button>

  <div class="flex items-center space-x-4">
    <!-- Botón para mostrar tip verde manual -->
    <button (click)="showGreenTip()"
      class="p-2 text-green-600 hover:bg-green-50 rounded-lg transition-colors duration-200"
      title="Consejos de Sostenibilidad">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
      <span class="text-xs">🌱</span>
    </button>

  </div>

  <!-- Notificación Verde -->
  <app-green-notification *ngIf="currentGreenTip" [tip]="currentGreenTip" [show]="showGreenNotification"
    (closed)="onGreenNotificationClosed()" (learnMoreClicked)="onLearnMoreClicked($event)"
    class="absolute top-16 right-4 z-50">
  </app-green-notification>
</nav>
