<div *ngIf="isVisible" class="absolute top-16 left-4 bg-white rounded-lg shadow-xl z-20 w-80 max-h-96 overflow-hidden">
  <!-- Header -->
  <div class="bg-[#021133] text-white p-3 flex justify-between items-center">
    <h4 class="font-semibold text-sm">🚌 Lista de Buses</h4>
    <button (click)="onClose()" class="text-white hover:text-gray-300 transition-colors" aria-label="Cerrar">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
      </svg>
    </button>
  </div>

  <!-- Lista de buses -->
  <div class="max-h-80 overflow-y-auto">
    <div *ngFor="let bus of buses; trackBy: trackByBus" (click)="onSelectBus(bus)"
      class="p-3 border-b border-gray-100 hover:bg-gray-50 cursor-pointer transition-colors"
      [class.opacity-50]="!bus.activo">

      <div class="flex items-center justify-between">
        <div class="flex items-center gap-3">
          <!-- Estado del bus -->
          <div [class]="getStatusColor(bus.estado)" class="w-2 h-2 rounded-full flex-shrink-0">
          </div>

          <div class="min-w-0 flex-1">
            <div class="font-medium text-gray-900 text-sm truncate">
              {{getBusTitle(bus)}}
            </div>
            <div class="text-xs text-gray-500 truncate">
              {{getBusInfo(bus)}}
            </div>
            <div class="text-xs text-gray-400">
              ID: {{bus.id}}
            </div>
          </div>
        </div>

        <div class="text-right flex-shrink-0 ml-2">
          <div [class]="'text-xs px-2 py-1 rounded-full text-white ' + getStatusColor(bus.estado)">
            {{getStatusText(bus.estado)}}
          </div>
          <div *ngIf="!bus.activo" class="text-xs text-red-500 mt-1">
            Desactivado
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
