<div *ngIf="show && notification" 
     [class]="getNotificationClass()"
     class="fixed top-4 right-4 z-50 max-w-sm w-full"
     role="alert"
     aria-live="polite">
  <div class="flex items-start">
    <div class="flex-shrink-0">
      <svg *ngIf="isAlerta()" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
              d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
      </svg>
      <svg *ngIf="!isAlerta()" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
              d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
    </div>
    
    <div class="ml-3 flex-1">
      <p [class]="getTitleClass()">{{ notification.titulo }}</p>
      <p class="mt-1 text-sm text-gray-600 dark:text-gray-300">
        {{ notification.descripcion }}
      </p>
      <p class="mt-1 text-xs text-gray-500 dark:text-gray-400">
        {{ notification.timestamp }}
      </p>
      
      <div *ngIf="notification.latitud && notification.longitud" class="mt-2 text-xs text-gray-500">
        <span>📍 Coordenadas: {{ notification.latitud }}, {{ notification.longitud }}</span>
      </div>
    </div>
    
    <div class="ml-4 flex-shrink-0">
      <button (click)="dismiss()" 
              class="inline-flex text-gray-400 hover:text-gray-600 dark:hover:text-gray-300">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>
  </div>
</div>
