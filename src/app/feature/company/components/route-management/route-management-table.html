<div class="bg-gray-800 rounded-xl shadow-sm border border-gray-700 overflow-hidden dark:bg-gray-800">
  <div class="p-4 border-b border-gray-700 flex justify-between items-center bg-gray-800/50 dark:bg-gray-800/50">
    <div>
      <h2 class="text-base font-bold text-gray-100">Listado de Rutas</h2>
      <p class="text-xs text-gray-400 mt-0.5">Gestiona los recorridos y estados de tu flota</p>
    </div>
    <button (click)="loadRoutes()" class="p-2 hover:bg-gray-700 rounded-lg transition-colors border border-transparent hover:border-gray-600" title="Refrescar">
      <lucide-icon name="rotate-cw" [class.animate-spin]="loading" class="w-5 h-5 text-gray-300"></lucide-icon>
    </button>
  </div>

  <div class="overflow-x-auto">
    <table class="w-full text-left border-collapse">
      <thead>
        <tr class="bg-gray-900/80 text-[11px] uppercase tracking-wider text-gray-400 font-semibold">
          <th class="px-5 py-3">Ruta</th>
          <th class="px-5 py-3">Código</th>
          <th class="px-5 py-3">Buses</th>
          <th class="px-5 py-3">Estado</th>
          <th class="px-5 py-3 text-right">Acciones</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-gray-700/50">
        <tr *ngFor="let route of routes" class="hover:bg-gray-700/30 transition-colors">
          <td class="px-5 py-3.5">
            <div class="flex items-center gap-3">
              <div [style.background-color]="route.color_hex" class="w-3 h-3 rounded-full shadow-sm"></div>
              <span class="text-sm font-medium text-gray-100">{{ route.nombre }}</span>
            </div>
          </td>
          <td class="px-5 py-3.5">
            <span class="text-xs font-mono bg-gray-700 text-gray-300 px-2 py-1 rounded">
              {{ route.codigo }}
            </span>
          </td>
          <td class="px-5 py-3.5">
            <div class="flex items-center gap-1.5 text-gray-400">
              <lucide-icon name="bus" class="w-4 h-4"></lucide-icon>
              <span class="text-sm font-medium text-gray-300">{{ getBusCount(route) }}</span>
            </div>
          </td>
          <td class="px-5 py-3.5">
            <button (click)="onToggleStatus(route)" 
              [class]="route.estado === 'ACTIVA' ? 'bg-emerald-900/60 text-emerald-400 border border-emerald-700/50' : 'bg-red-900/60 text-red-400 border border-red-700/50'"
              class="text-[10px] font-bold px-2.5 py-1 rounded-full transition-all hover:ring-2 ring-offset-1 ring-offset-gray-800 ring-current cursor-pointer">
              {{ route.estado === 'ACTIVA' ? 'ACTIVA' : 'INACTIVA' }}
            </button>
          </td>
          <td class="px-5 py-3.5 text-right">
            <div class="flex justify-end gap-1.5">
              <button class="p-2 text-blue-400 hover:bg-blue-900/30 rounded-lg transition-colors" title="Editar">
                <lucide-icon name="edit-3" class="w-4 h-4"></lucide-icon>
              </button>
              <button (click)="onDelete(route)" class="p-2 text-red-400 hover:bg-red-900/30 rounded-lg transition-colors" title="Eliminar">
                <lucide-icon name="trash-2" class="w-4 h-4"></lucide-icon>
              </button>
            </div>
          </td>
        </tr>

        <tr *ngIf="routes.length === 0 && !loading">
          <td colspan="5" class="px-5 py-10 text-center">
            <div class="flex flex-col items-center gap-2">
              <lucide-icon name="map" class="w-10 h-10 text-gray-600"></lucide-icon>
              <p class="text-sm text-gray-500">No se encontraron rutas registradas</p>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div *ngIf="loading" class="absolute inset-0 bg-gray-800/80 backdrop-blur-[1px] flex items-center justify-center z-10">
    <div class="flex flex-col items-center gap-3">
      <div class="w-8 h-8 border-3 border-blue-500 border-t-transparent rounded-full animate-spin"></div>
      <span class="text-xs font-medium text-blue-400">Actualizando rutas...</span>
    </div>
  </div>
</div>
