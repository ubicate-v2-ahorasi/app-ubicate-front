<div
  *ngIf="isVisible"
  class="absolute left-4 z-30 max-h-80 w-80 overflow-hidden rounded-lg bg-white shadow-xl"
  [ngClass]="showBelowBusSearch ? 'top-[7.5rem]' : 'top-14'"
>
  <div class="flex items-center justify-between bg-[#021133] p-2.5 text-white">
    <h4 class="font-semibold text-xs">Lista de Rutas</h4>
    <div class="flex items-center gap-1.5">
      <button
        type="button"
        (click)="onCreateRoute()"
        class="inline-flex items-center gap-1 rounded-md bg-white/10 px-2 py-1 text-[11px] font-medium text-white transition-colors hover:bg-white/20"
      >
        <lucide-icon name="plus" class="h-3.5 w-3.5"></lucide-icon>
        Nueva ruta
      </button>
      <button (click)="onClose()" class="text-white transition-colors hover:text-gray-300" aria-label="Cerrar">
        <lucide-icon name="x" class="h-4 w-4"></lucide-icon>
      </button>
    </div>
  </div>

  <div *ngIf="error" class="border-l-4 border-red-400 bg-red-50 p-2.5 text-xs text-red-700">{{error}}</div>

  <div *ngIf="loading" class="p-3 text-center">
    <div class="mx-auto h-6 w-6 animate-spin rounded-full border-b-2 border-blue-600"></div>
    <p class="mt-1.5 text-xs text-gray-600">Cargando rutas...</p>
  </div>

  <div *ngIf="!loading" class="max-h-64 overflow-y-auto">
    <div *ngIf="routes.length === 0" class="p-3 text-center text-xs text-gray-500">No hay rutas disponibles</div>

    <div *ngFor="let route of routes; trackBy: trackByRoute" (click)="onSelectRoute(route)"
      class="cursor-pointer border-b border-gray-100 p-2.5 transition-colors hover:bg-gray-50"
      [class.opacity-50]="route.estado !== 'ACTIVA'">
      <div class="flex items-start justify-between">
        <div class="flex min-w-0 flex-1 items-start gap-2">
          <div [style.background-color]="route.color_hex"
            class="mt-0.5 h-3 w-3 flex-shrink-0 rounded border border-gray-300"></div>
          <div class="min-w-0 flex-1">
            <div class="mb-0.5 flex items-center gap-1.5">
              <div class="truncate text-xs font-medium text-gray-900">{{route.nombre}}</div>
              <span class="flex-shrink-0 rounded-full bg-gray-100 px-1.5 py-0.5 text-[10px] text-gray-600">
                {{route.codigo}}
              </span>
            </div>
            <div class="mb-0.5 truncate text-[10px] text-gray-500">{{getOriginDestination(route)}}</div>
            <div class="truncate text-[10px] text-gray-400">{{getRouteInfo(route)}}</div>
            <div class="mt-0.5 text-[10px] text-gray-400">Creada: {{formatDate(route.fecha_creacion)}}</div>
          </div>
        </div>
        <div class="ml-1.5 flex flex-shrink-0 flex-col gap-1">
          <button (click)="onToggleRoute($event, route)"
            [class]="route.estado === 'ACTIVA' ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'"
            class="rounded-full px-1.5 py-0.5 text-[10px] transition-colors">
            {{route.estado === 'ACTIVA' ? 'Activa' : 'Inactiva'}}
          </button>

          <button (click)="onEditRoute($event, route)"
            class="mt-1 self-center rounded-full p-1 text-blue-500 transition-colors hover:bg-blue-50"
            title="Editar ruta en mapa">
            <lucide-icon name="edit" class="h-3.5 w-3.5"></lucide-icon>
          </button>

          <button (click)="onDeleteRoute($event, route)"
            class="mt-1 self-center rounded-full p-1 text-red-500 transition-colors hover:bg-red-50"
            title="Eliminar ruta">
            <lucide-icon name="trash-2" class="h-3.5 w-3.5"></lucide-icon>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<app-delete-route-modal
  [isVisible]="showDeleteModal"
  [route]="routeToDelete"
  [isDeleting]="isDeleting"
  (confirm)="onConfirmDelete()"
  (cancel)="onCancelDelete()"
></app-delete-route-modal>

<app-success-modal
  [isVisible]="showSuccessModal"
  [routeName]="deletedRouteName"
  (close)="onCloseSuccess()"
></app-success-modal>
