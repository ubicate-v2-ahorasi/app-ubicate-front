<div *ngIf="isVisible">
  <div class="fixed inset-0 bg-black/50 backdrop-blur-sm z-40" (click)="onCancel()"></div>
  
  <div class="fixed inset-0 overflow-y-auto h-full w-full z-50 flex items-center justify-center p-4 pointer-events-none">
    <div class="bg-white dark:bg-gray-800 rounded-lg shadow-2xl max-w-md w-full pointer-events-auto">
      <div class="p-6">
        <div class="flex items-center gap-3 mb-4">
          <div class="w-12 h-12 bg-red-100 dark:bg-red-900/30 rounded-full flex items-center justify-center flex-shrink-0">
            <lucide-icon name="alert-triangle" class="w-6 h-6 text-red-600 dark:text-red-400"></lucide-icon>
          </div>
          <div>
            <h3 class="text-lg font-semibold text-gray-900 dark:text-white">Eliminar Ruta</h3>
            <p class="text-sm text-gray-500 dark:text-gray-400">Esta acción es irreversible</p>
          </div>
        </div>

        <div class="mb-6">
          <p class="text-gray-700 dark:text-gray-300 mb-3">¿Estás seguro de que deseas eliminar la ruta?</p>
          <div class="bg-gray-50 dark:bg-gray-700 rounded-lg p-3 border border-gray-200 dark:border-gray-600">
            <div class="flex items-center gap-2 mb-2">
              <div [style.background-color]="route?.color_hex || '#ccc'" class="w-4 h-4 rounded border border-gray-300 dark:border-gray-600"></div>
              <span class="font-semibold text-gray-900 dark:text-white">{{route?.nombre || 'Cargando...'}}</span>
              <span class="text-xs bg-gray-200 dark:bg-gray-600 text-gray-600 dark:text-gray-300 px-2 py-0.5 rounded-full">{{route?.codigo || ''}}</span>
            </div>
            <p class="text-sm text-gray-600 dark:text-gray-400">{{route?.descripcion || 'Sin descripción'}}</p>
          </div>
        </div>

        <div class="flex gap-3 justify-end">
          <button
            (click)="onCancel()"
            class="px-4 py-2 bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 text-gray-700 dark:text-gray-200 rounded-lg transition-colors font-medium"
          >
            Cancelar
          </button>
          <button
            (click)="onConfirm()"
            [disabled]="isDeleting"
            class="px-4 py-2 bg-red-600 hover:bg-red-700 dark:bg-red-700 dark:hover:bg-red-800 text-white rounded-lg transition-colors font-medium disabled:opacity-50 disabled:cursor-not-allowed flex items-center gap-2"
          >
            <lucide-icon *ngIf="isDeleting" name="loader-2" class="w-4 h-4 animate-spin"></lucide-icon>
            <span>{{isDeleting ? 'Eliminando...' : 'Eliminar'}}</span>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
