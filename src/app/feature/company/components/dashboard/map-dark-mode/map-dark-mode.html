<button
  type="button"
  (click)="toggleTheme()"
  class="px-2 py-1 rounded text-xs transition-colors flex items-center gap-1"
  [class.bg-gray-800]="isDarkMode"
  [class.bg-gray-700]="!isDarkMode"
  [class.hover:bg-gray-900]="isDarkMode"
  [class.hover:bg-gray-600]="!isDarkMode"
  [disabled]="disabled"
  [title]="isDarkMode ? 'Modo claro' : 'Modo oscuro'"
>
  <lucide-icon [name]="isDarkMode ? 'sun' : 'moon'" class="w-4 h-4"></lucide-icon>
</button>
