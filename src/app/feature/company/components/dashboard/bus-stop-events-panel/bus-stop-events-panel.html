<div
  class="mt-3 w-full max-w-none overflow-hidden rounded-xl backdrop-blur-xl transition-colors"
  [ngClass]="(isDarkMode$ | async)
    ? 'border border-white/8 bg-[#0B1628]/96 text-white shadow-[0_8px_24px_rgba(2,6,23,0.22)]'
    : 'border border-slate-200/90 bg-white/96 text-slate-900 shadow-[0_8px_24px_rgba(15,23,42,0.08)]'"
>
  <div
    class="flex items-center justify-between px-4 py-3 transition-colors"
    [ngClass]="(isDarkMode$ | async)
      ? 'border-b border-white/6 bg-gradient-to-r from-[#0E1D35] to-[#0A1424]'
      : 'border-b border-slate-200 bg-gradient-to-r from-slate-50 to-white'"
  >
    <h3 class="text-xs font-semibold">Cruce de paradas</h3>
    <button
      type="button"
      class="text-xs transition-colors"
      [ngClass]="(isDarkMode$ | async) ? 'text-blue-300 hover:text-blue-200' : 'text-blue-600 hover:text-blue-700'"
    >
      Ver todos
    </button>
  </div>

  <div class="max-h-[260px] overflow-y-auto px-4 py-2">
    <div
      *ngFor="let event of events; let last = last"
      class="flex items-start gap-2.5 py-2.5"
      [ngClass]="!last ? ((isDarkMode$ | async) ? 'border-b border-white/6' : 'border-b border-slate-100') : ''"
    >
      <div
        class="mt-0.5 flex h-6 w-6 shrink-0 items-center justify-center rounded-full text-xs"
        [ngClass]="(isDarkMode$ | async) ? getToneClasses(event.tone) : getToneClassesLight(event.tone)"
      >
        <span>•</span>
      </div>

      <div class="min-w-0 flex-1">
        <div class="flex items-start gap-2.5">
          <span
            class="w-[62px] shrink-0 text-xs"
            [ngClass]="(isDarkMode$ | async) ? 'text-slate-300' : 'text-slate-500'"
          >
            {{ event.time }}
          </span>

          <div class="min-w-0">
            <div class="text-xs font-semibold">
              {{ event.title }}
            </div>
            <div
              class="mt-0.5 text-xs"
              [ngClass]="(isDarkMode$ | async) ? 'text-slate-400' : 'text-slate-500'"
            >
              {{ event.subtitle }}
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
