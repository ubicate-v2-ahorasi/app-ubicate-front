<div class="absolute top-16 left-4 z-20 bg-white rounded-lg shadow-xl border border-gray-200 p-3 w-64">
  <div class="flex justify-between items-center mb-2">
    <h4 class="font-semibold text-sm text-gray-800">🛣️ Nueva Ruta</h4>
    <button (click)="onCancel()" class="text-gray-500 hover:text-gray-700">
      <lucide-icon name="x" class="h-5 w-5"></lucide-icon>
    </button>
  </div>

  <div class="space-y-2">
    <div>
      <label class="block text-xs font-medium text-gray-700 mb-1">Nombre</label>
      <input [(ngModel)]="routeData.nombre" type="text" placeholder="Ej: Ruta Centro-Norte"
        class="w-full px-2 py-1.5 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
    </div>

    <div>
      <label class="block text-xs font-medium text-gray-700 mb-1">Código</label>
      <input [(ngModel)]="routeData.codigo" type="text" placeholder="Ej: R001"
        class="w-full px-2 py-1.5 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
    </div>

    <div>
      <label class="block text-xs font-medium text-gray-700 mb-1">Color</label>
      <div class="flex gap-2">
        <input [(ngModel)]="routeData.colorHex" (ngModelChange)="onColorChange()" type="color"
          class="w-10 h-7 rounded border border-gray-300" />
        <input [(ngModel)]="routeData.colorHex" (ngModelChange)="onColorChange()" type="text"
          class="flex-1 px-2 py-1.5 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
      </div>
    </div>

    <div class="bg-blue-50 p-2 rounded-md">
      <p class="text-xs text-blue-700 flex items-center gap-1">
        <lucide-icon name="map-pin" class="w-4 h-4"></lucide-icon>
        Haz clic en el mapa: primero origen (A), luego destino (B)
      </p>
    </div>

    <div class="flex gap-2">
      <button (click)="onSave()" [disabled]="!isFormValid"
        class="flex-1 bg-blue-600 hover:bg-blue-700 disabled:bg-gray-300 text-white px-3 py-1.5 rounded-md text-sm font-medium disabled:cursor-not-allowed">
        Guardar Ruta
      </button>
      <button (click)="onClear()"
        class="px-3 py-1.5 border border-gray-300 text-gray-700 rounded-md text-sm font-medium hover:bg-gray-50">
        Limpiar
      </button>
    </div>
  </div>
</div>

<div *ngIf="isCreatingRoute && !hasOrigin"
  class="absolute top-20 left-1/2 transform -translate-x-1/2 bg-green-600 text-white px-4 py-2 rounded-lg shadow-lg z-35">
  <div class="flex items-center gap-2">
    <div class="animate-pulse w-3 h-3 bg-white rounded-full"></div>
    <span class="text-sm font-medium">Haz click en el mapa para colocar el ORIGEN (punto A)</span>
  </div>
</div>

<div *ngIf="isCreatingRoute && hasOrigin && !hasDestination"
  class="absolute top-20 left-1/2 transform -translate-x-1/2 bg-red-600 text-white px-4 py-2 rounded-lg shadow-lg z-35">
  <div class="flex items-center gap-2">
    <div class="animate-pulse w-3 h-3 bg-white rounded-full"></div>
    <span class="text-sm font-medium">Ahora haz click para colocar el DESTINO (punto B)</span>
  </div>
</div>
