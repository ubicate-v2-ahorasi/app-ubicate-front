<div
  [@panelAnimation]="animationKey"
  class="w-full max-w-none self-stretch overflow-hidden rounded-xl backdrop-blur-xl transition-colors"
  [ngClass]="(isDarkMode$ | async)
    ? 'border border-white/8 bg-[#0B1628]/96 text-white shadow-[0_10px_28px_rgba(2,6,23,0.32)]'
    : 'border border-slate-200/90 bg-white/96 text-slate-900 shadow-[0_10px_28px_rgba(15,23,42,0.10)]'"
>
  <div
    class="px-4 py-3 transition-colors"
    [ngClass]="(isDarkMode$ | async)
      ? 'border-b border-white/6 bg-gradient-to-r from-[#0E1D35] to-[#0A1424]'
      : 'border-b border-slate-200 bg-gradient-to-r from-slate-50 to-white'"
  >
    <div class="flex items-start justify-between gap-4">
      <div class="flex min-w-0 items-start gap-2.5">
        <div
          class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl shadow-inner transition-colors"
          [ngClass]="(isDarkMode$ | async) ? 'bg-[#17345F] text-blue-200' : 'bg-blue-100 text-blue-700'"
        >
          <lucide-icon name="bus" class="h-5 w-5"></lucide-icon>
        </div>
        <div class="min-w-0">
          <div class="truncate text-base font-semibold tracking-wide">
            {{ bus.placa || ('BUS-' + bus.id) }}
          </div>
          <div
            class="mt-0.5 flex items-center gap-2 text-xs transition-colors"
            [ngClass]="(isDarkMode$ | async) ? 'text-slate-300' : 'text-slate-600'"
          >
            <span class="h-2 w-2 rounded-full" [ngClass]="statusClasses"></span>
            <span>{{ statusLabel }}</span>
          </div>
        </div>
      </div>

      <button
        (click)="close()"
        class="rounded-full p-1 transition-colors"
        [ngClass]="(isDarkMode$ | async)
          ? 'border border-white/10 bg-white/5 text-slate-300 hover:bg-white/10 hover:text-white'
          : 'border border-slate-200 bg-white text-slate-500 hover:bg-slate-100 hover:text-slate-900'"
        title="Cerrar"
      >
        <lucide-icon name="x" class="h-3.5 w-3.5"></lucide-icon>
      </button>
    </div>
  </div>

  <div class="space-y-3 px-4 py-3 text-xs">
    <div class="flex items-start justify-between gap-4">
      <span [ngClass]="(isDarkMode$ | async) ? 'text-slate-400' : 'text-slate-500'">Placa</span>
      <span
        class="text-right font-medium"
        [ngClass]="(isDarkMode$ | async) ? 'text-slate-100' : 'text-slate-900'"
      >{{ bus.placa || 'Sin registro' }}</span>
    </div>

    <div class="flex items-start justify-between gap-4">
      <span [ngClass]="(isDarkMode$ | async) ? 'text-slate-400' : 'text-slate-500'">Conductor</span>
      <span
        class="text-right font-medium"
        [ngClass]="(isDarkMode$ | async) ? 'text-slate-100' : 'text-slate-900'"
      >{{ bus.conductor || 'No asignado' }}</span>
    </div>

    <div class="flex items-start justify-between gap-4">
      <span [ngClass]="(isDarkMode$ | async) ? 'text-slate-400' : 'text-slate-500'">Velocidad</span>
      <span
        class="text-right font-medium"
        [ngClass]="(isDarkMode$ | async) ? 'text-slate-100' : 'text-slate-900'"
      >
        {{ bus.velocidad != null ? (bus.velocidad + ' km/h') : 'Sin datos' }}
      </span>
    </div>

    <div class="flex items-start justify-between gap-4">
      <span [ngClass]="(isDarkMode$ | async) ? 'text-slate-400' : 'text-slate-500'">Direccion</span>
      <span
        class="max-w-[156px] text-right font-medium leading-5"
        [ngClass]="(isDarkMode$ | async) ? 'text-slate-100' : 'text-slate-900'"
      >
        {{ bus.address }}
      </span>
    </div>

    <div
      class="pt-3"
      [ngClass]="(isDarkMode$ | async) ? 'border-t border-white/6' : 'border-t border-slate-200'"
    >
      <div class="flex items-start justify-between gap-4">
        <span [ngClass]="(isDarkMode$ | async) ? 'text-slate-400' : 'text-slate-500'">Ultima actualizacion</span>
        <span
          class="text-right font-semibold"
          [ngClass]="(isDarkMode$ | async) ? 'text-slate-100' : 'text-slate-900'"
        >
          {{ formattedUpdatedAt }}
        </span>
      </div>
    </div>
  </div>
</div>
