<div class="flex gap-4 w-full" *ngIf="stats">
  <!-- Total Buses -->
  <div
    class="flex-1 min-w-36 p-6 bg-white border border-gray-200 rounded-xl shadow-sm hover:shadow-md transition-all duration-300 hover:-translate-y-1 cursor-pointer">
    <div class="flex items-start justify-between">
      <div class="flex flex-col">
        <div class="text-3xl font-bold text-gray-900 mb-1">{{ stats.total_buses }}</div>
        <div class="text-xs text-gray-600 font-normal">Total Buses</div>
      </div>
      <div class="w-12 h-12 rounded-full bg-blue-100 flex items-center justify-center flex-shrink-0">
        <svg class="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <rect x="3" y="6" width="18" height="10" rx="2" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>
          <circle cx="8" cy="19" r="2" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>
          <circle cx="16" cy="19" r="2" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>
          <path d="M3 12h18M8 6v6M16 6v6" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>
        </svg>
      </div>
    </div>
  </div>

  <!-- Activos -->
  <div
    class="flex-1 min-w-36 p-6 bg-white border border-gray-200 rounded-xl shadow-sm hover:shadow-md transition-all duration-300 hover:-translate-y-1 cursor-pointer">
    <div class="flex items-start justify-between">
      <div class="flex flex-col">
        <div class="text-3xl font-bold text-gray-900 mb-1">{{ stats.buses_activos }}</div>
        <div class="text-xs text-gray-600 font-normal">Activos</div>
      </div>
      <div class="w-12 h-12 rounded-full bg-green-100 flex items-center justify-center flex-shrink-0">
        <svg class="w-6 h-6 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>
        </svg>
      </div>
    </div>
  </div>

  <!-- Inactivos -->
  <div
    class="flex-1 min-w-36 p-6 bg-white border border-gray-200 rounded-xl shadow-sm hover:shadow-md transition-all duration-300 hover:-translate-y-1 cursor-pointer">
    <div class="flex items-start justify-between">
      <div class="flex flex-col">
        <div class="text-3xl font-bold text-gray-900 mb-1">{{ stats.buses_inactivos }}</div>
        <div class="text-xs text-gray-600 font-normal">Inactivos</div>
      </div>
      <div class="w-12 h-12 rounded-full bg-red-100 flex items-center justify-center flex-shrink-0">
        <svg class="w-6 h-6 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>
        </svg>
      </div>
    </div>
  </div>

  <!-- Mantenimiento -->
  <div
    class="flex-1 min-w-36 p-6 bg-white border border-gray-200 rounded-xl shadow-sm hover:shadow-md transition-all duration-300 hover:-translate-y-1 cursor-pointer">
    <div class="flex items-start justify-between">
      <div class="flex flex-col">
        <div class="text-3xl font-bold text-gray-900 mb-1">{{ stats.buses_en_mantenimiento }}</div>
        <div class="text-xs text-gray-600 font-normal">Mantenimiento</div>
      </div>
      <div class="w-12 h-12 rounded-full bg-orange-100 flex items-center justify-center flex-shrink-0">
        <svg class="w-6 h-6 text-orange-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>
          <path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>
        </svg>
      </div>
    </div>
  </div>

</div>
