<!-- green-notification.html -->
@if (show) {
<div class="fixed top-4 right-4 z-50 max-w-[240px] animate-slide-in">
  <div [class]="getNotificationClass()" class="notification-container rounded-lg shadow-lg dark:shadow-2xl p-2 cursor-default">
    <div class="flex items-start gap-1">
      <div class="flex-shrink-0">
        <span class="text-sm">{{tip.icon}}</span>
      </div>
      <div class="flex-1 min-w-0">
        <h4 class="text-[10px] font-semibold text-gray-800 dark:text-gray-100 leading-tight">{{tip.title}}</h4>
        <p class="text-[9px] text-gray-600 dark:text-gray-300 mt-0.5 line-clamp-2 leading-tight">{{tip.message}}</p>
      </div>
      <button (click)="close()" class="flex-shrink-0 text-gray-400 dark:text-gray-500 hover:text-gray-600 dark:hover:text-gray-300 transition-colors">
        <span class="sr-only">Cerrar</span>
        <svg class="w-2 h-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <div class="mt-1 flex gap-1">
      <button (click)="learnMore()"
        class="text-[9px] bg-green-100 dark:bg-green-900/30 text-green-700 dark:text-green-400 px-1.5 py-0.5 rounded-full hover:bg-green-200 dark:hover:bg-green-900/50 transition-colors">
        📚 Más
      </button>
      <button (click)="dismiss()"
        class="text-[9px] bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 px-1.5 py-0.5 rounded-full hover:bg-gray-200 dark:hover:bg-gray-600 transition-colors">
        ✓ OK
      </button>
    </div>

    <!-- Indicador de tipo de notificación -->
    <div class="mt-1 text-[9px] text-gray-500 dark:text-gray-400">
      @if (tip.type === 'tip') {
      <span>💡 Consejo de sostenibilidad</span>
      }
      @if (tip.type === 'achievement') {
      <span>🏆 Logro alcanzado</span>
      }
      @if (tip.type === 'challenge') {
      <span>🎯 Desafío verde</span>
      }
      @if (tip.type === 'info') {
      <span>ℹ️ Información</span>
      }
    </div>
  </div>
</div>
}
