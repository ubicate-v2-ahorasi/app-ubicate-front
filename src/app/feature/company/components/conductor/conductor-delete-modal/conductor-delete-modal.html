<!-- Modal de Confirmación para Eliminar -->
<div *ngIf="isVisible" class="fixed inset-0 overflow-y-auto h-full w-full z-50 flex items-center justify-center p-4">
  <div class="bg-white dark:bg-gray-800 w-96 shadow-2xl rounded-xl border border-gray-200 dark:border-gray-700">
    <div class="p-6 text-center">
      <div class="mx-auto flex items-center justify-center h-12 w-12 rounded-full bg-red-100 dark:bg-red-900/30 mb-4">
        <svg class="h-6 w-6 text-red-600 dark:text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L3.732 16c-.77.833.192 2.5 1.732 2.5z" />
        </svg>
      </div>

      <h3 class="text-xl font-semibold text-gray-900 dark:text-white mb-4">Eliminar Conductor</h3>

      <div class="mb-6">
        <p class="text-sm text-gray-600 dark:text-gray-400" *ngIf="conductor">
          ¿Estás seguro de que deseas eliminar a <strong class="text-gray-900 dark:text-white">{{ conductor.nombre_completo }}</strong>?
          Esta acción no se puede deshacer.
        </p>
      </div>

      <div class="flex justify-center space-x-4">
        <button (click)="cancelDelete()" [disabled]="isDeleting"
          class="px-6 py-3 text-sm font-medium text-gray-700 dark:text-gray-300 bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-600 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
          Cancelar
        </button>
        <button (click)="confirmDelete()" [disabled]="isDeleting"
          class="px-6 py-3 text-sm font-medium text-white bg-red-600 dark:bg-red-700 border border-transparent rounded-lg hover:bg-red-700 dark:hover:bg-red-800 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
          <span *ngIf="!isDeleting">Eliminar</span>
          <span *ngIf="isDeleting">Eliminando...</span>
        </button>
      </div>
    </div>
  </div>
</div>
