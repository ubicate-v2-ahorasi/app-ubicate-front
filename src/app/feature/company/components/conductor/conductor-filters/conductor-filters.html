<!-- Filtros y Búsqueda -->
<div class="bg-white dark:bg-gray-800 rounded-lg shadow-sm border border-gray-200 dark:border-gray-700 p-6 mb-6 transition-colors">

  <div class="flex flex-col sm:flex-row items-end gap-4">

    <!-- Búsqueda -->
    <div class="flex-1 min-w-0">
      <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Buscar</label>
      <div class="relative">
        <input type="text" placeholder="Nombre, DNI o licencia..." [(ngModel)]="searchTerm" (input)="onSearchInput()"
          class="w-full pl-10 pr-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-white dark:bg-gray-700 dark:text-white transition-all">
        <svg class="absolute left-3 top-2.5 w-5 h-5 text-gray-400 dark:text-gray-500" fill="none" stroke="currentColor"
          viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="m21 21-6-6m2-5a7 7 0 1 1-14 0 7 7 0 0 1 14 0z" />
        </svg>
      </div>
    </div>

    <!-- Estado -->
    <div class="w-full sm:w-48">
      <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Estado</label>
      <select [(ngModel)]="selectedEstado" (change)="onEstadoSelect()"
        class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-white dark:bg-gray-700 dark:text-white transition-all">
        <option *ngFor="let estado of estados" [value]="estado">{{ estado }}</option>
      </select>
    </div>

    <!-- Categoría -->
    <div class="w-full sm:w-48">
      <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Categoría</label>
      <select [(ngModel)]="selectedCategoria" (change)="onCategoriaSelect()"
        class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-white dark:bg-gray-700 dark:text-white transition-all">
        <option *ngFor="let categoria of categorias" [value]="categoria">{{ categoria }}</option>
      </select>
    </div>


    <!-- Botón Limpiar -->
    <div class="w-full sm:w-auto">
      <button (click)="clearAllFilters()"
        class="w-full sm:w-auto px-4 py-2 text-sm font-medium text-gray-600 dark:text-gray-300 hover:text-gray-800 dark:hover:text-white hover:bg-gray-100 dark:hover:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-lg transition-colors">
        Limpiar
      </button>
    </div>

    <!-- Botón Nuevo Conductor -->
    <div class="w-full sm:w-auto">
      <button (click)="createNewConductor()"
        class="w-full sm:w-auto bg-gradient-to-r from-[#040E1C] to-[#021133] dark:from-gray-700 dark:to-gray-600 hover:opacity-90 text-white font-medium px-6 py-2 rounded-lg transition-all duration-200 flex items-center gap-2 shadow-sm hover:shadow-md">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
        </svg>
        Nuevo Conductor
      </button>
    </div>

  </div>

</div>
