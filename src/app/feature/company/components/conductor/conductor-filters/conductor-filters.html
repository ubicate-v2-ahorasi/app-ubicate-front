<div class="bg-white dark:bg-gray-800 rounded-lg shadow-sm border border-gray-200 dark:border-gray-700 p-4 mb-4 transition-colors">

  <div class="flex flex-col items-stretch gap-3 sm:flex-row sm:items-end">

    <div class="w-full min-w-0 sm:flex-1">
      <label class="block text-xs font-medium text-gray-700 dark:text-gray-300 mb-1.5">Buscar</label>
      <div class="relative">
        <input type="text" placeholder="Nombre, DNI o licencia..." [(ngModel)]="searchTerm" (input)="onSearchInput()"
          class="w-full pl-9 pr-4 py-1.5 text-sm border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-white dark:bg-gray-700 dark:text-white transition-all">
        <svg class="absolute left-2.5 top-2 w-4 h-4 text-gray-400 dark:text-gray-500" fill="none" stroke="currentColor"
          viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="m21 21-6-6m2-5a7 7 0 1 1-14 0 7 7 0 0 1 14 0z" />
        </svg>
      </div>
    </div>

    <div class="w-full sm:w-40">
      <label class="block text-xs font-medium text-gray-700 dark:text-gray-300 mb-1.5">Estado</label>
      <app-animated-select
        [(ngModel)]="selectedEstado"
        (valueChange)="onEstadoSelect()"
        [options]="estadoOptions"
      ></app-animated-select>
    </div>

    <div class="w-full sm:w-40">
      <label class="block text-xs font-medium text-gray-700 dark:text-gray-300 mb-1.5">Categoria</label>
      <app-animated-select
        [(ngModel)]="selectedCategoria"
        (valueChange)="onCategoriaSelect()"
        [options]="categoriaOptions"
      ></app-animated-select>
    </div>

    <div class="w-full sm:w-auto flex items-end gap-2">
      <button *ngIf="hasActiveFilters()" type="button" (click)="clearAllFilters()" title="Limpiar filtros" aria-label="Limpiar filtros"
        class="h-9 w-9 inline-flex items-center justify-center text-gray-600 dark:text-gray-300 hover:text-gray-800 dark:hover:text-white hover:bg-gray-100 dark:hover:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-lg transition-colors">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
        </svg>
      </button>

      <button type="button" (click)="toggleSortDirection()"
        [title]="sortDirection === 'desc' ? 'Orden descendente' : 'Orden ascendente'"
        [attr.aria-label]="sortDirection === 'desc' ? 'Cambiar a orden ascendente' : 'Cambiar a orden descendente'"
        class="h-9 w-9 inline-flex items-center justify-center text-gray-600 dark:text-gray-300 hover:text-gray-800 dark:hover:text-white hover:bg-gray-100 dark:hover:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-lg transition-colors">
        <svg *ngIf="sortDirection === 'desc'; else ascendingIcon" class="w-4 h-4" fill="none" stroke="currentColor"
          viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M3 7h12M3 12h9M3 17h6m11-3-4 4m0 0-4-4m4 4V4" />
        </svg>
        <ng-template #ascendingIcon>
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M3 7h6M3 12h9M3 17h12m5-11-4-4m0 0-4 4m4-4v18" />
          </svg>
        </ng-template>
      </button>
    </div>

    <div class="w-full sm:w-auto flex items-end">
      <button (click)="createNewConductor()"
        class="w-full sm:w-auto h-9 bg-gradient-to-r from-[#040E1C] to-[#021133] dark:from-gray-700 dark:to-gray-600 hover:opacity-90 text-white font-medium px-4 text-sm rounded-lg transition-all duration-200 inline-flex items-center justify-center gap-2 shadow-sm hover:shadow-md whitespace-nowrap">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
        </svg>
        Nuevo Conductor
      </button>
    </div>

  </div>

</div>
