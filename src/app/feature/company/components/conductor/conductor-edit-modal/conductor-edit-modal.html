@if (isVisible) {
<!-- Fondo difuminado -->
<div class="fixed inset-0 bg-black/50 backdrop-blur-sm z-40" (click)="cancel()"></div>

<!-- Modal -->
<div class="fixed inset-0 overflow-y-auto h-full w-full z-50 flex items-center justify-center p-4 pointer-events-none">
  <div class="bg-white dark:bg-gray-800 w-full max-w-2xl shadow-2xl rounded-2xl overflow-hidden pointer-events-auto">

    <!-- Header del Modal -->
    <div class="flex justify-between items-center px-6 py-4 bg-[#040E1C] text-white">
      <h3 class="text-lg font-semibold">Editar Conductor</h3>
      <button (click)="cancel()" class="text-white/70 hover:text-white transition-colors">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <!-- Formulario -->
    <form [formGroup]="conductorForm" (ngSubmit)="onSubmit()" class="px-6 py-5">

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-5">
        <!-- Estado -->
        <div>
          <label class="block text-xs font-medium text-[#040E1C] dark:text-gray-300 mb-1">Estado</label>
          <select formControlName="estado"
            class="w-full px-3 py-2 text-sm border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-[#040E1C] focus:border-[#040E1C] transition-all bg-white dark:bg-gray-700 text-gray-900 dark:text-white">
            @for (estado of estados; track estado) {
            <option [value]="estado">{{ estado }}</option>
            }
          </select>
        </div>

        <!-- Teléfono -->
        <div>
          <label class="block text-xs font-medium text-[#040E1C] dark:text-gray-300 mb-1">Teléfono</label>
          <input type="tel" formControlName="telefono" placeholder="Teléfono del conductor" maxlength="9" (keypress)="onlyNumbers($event)"
            [class.border-red-500]="conductorForm.get('telefono')?.errors && conductorForm.get('telefono')?.touched"
            [class.dark:border-red-400]="conductorForm.get('telefono')?.errors && conductorForm.get('telefono')?.touched"
            class="w-full px-3 py-2 text-sm border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-[#040E1C] focus:border-[#040E1C] transition-all bg-white dark:bg-gray-700 text-gray-900 dark:text-white placeholder-gray-400 dark:placeholder-gray-500">
          @if (conductorForm.get('telefono')?.errors && conductorForm.get('telefono')?.touched) {
          <div class="text-red-500 dark:text-red-400 text-xs mt-1">
            Teléfono debe tener 9 dígitos
          </div>
          }
        </div>

        <!-- Bus Asignado -->
        <div class="md:col-span-2">
          <label class="block text-xs font-medium text-[#040E1C] dark:text-gray-300 mb-1">Bus Asignado</label>
          <select formControlName="busAsignadoId"
            class="w-full px-3 py-2 text-sm border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-[#040E1C] focus:border-[#040E1C] transition-all bg-white dark:bg-gray-700 text-gray-900 dark:text-white">
            <option [ngValue]="null">Sin bus asignado</option>
            @for (bus of buses; track bus.id) {
            <option [value]="bus.id"
              [disabled]="bus.conductorAsignadoId && bus.conductorAsignadoId !== conductor.id">
              {{ bus.placa }} - {{ bus.modelo || '—' }}
            </option>
            }
          </select>
        </div>
      </div>

      <!-- Botones -->
      <div class="flex justify-between pt-5 border-t border-gray-200 dark:border-gray-700">
        <button type="button" (click)="deleteClick()" [disabled]="isSubmitting"
          class="px-5 py-2.5 text-sm font-medium text-white bg-red-600 dark:bg-red-700 border border-transparent rounded-lg hover:bg-red-700 dark:hover:bg-red-800 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
          Eliminar
        </button>
        
        <div class="flex space-x-3">
          <button type="button" (click)="cancel()" [disabled]="isSubmitting"
            class="px-5 py-2.5 text-sm font-medium text-gray-700 dark:text-gray-300 bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-600 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
            Cancelar
          </button>
          <button type="submit" [disabled]="conductorForm.invalid || isSubmitting"
            class="px-5 py-2.5 text-sm font-medium text-white bg-[#040E1C] dark:bg-gray-600 border border-transparent rounded-lg hover:bg-[#021133] dark:hover:bg-gray-500 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
            {{ submitButtonText }}
          </button>
        </div>
      </div>
    </form>
  </div>
</div>
}
