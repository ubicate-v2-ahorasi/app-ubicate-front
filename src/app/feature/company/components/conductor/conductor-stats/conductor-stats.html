<!-- Compact KPIs -->
<div *ngIf="!loading && stats as s" class="grid grid-cols-2 md:grid-cols-4 gap-4">

  <!-- Total -->
  <div class="p-6 bg-white border border-gray-200 rounded-xl shadow-sm hover:shadow-md transition-all duration-300 hover:-translate-y-1 cursor-pointer">
    <div class="flex items-start justify-between">
      <div class="flex flex-col">
        <div class="text-3xl font-bold text-gray-900 mb-1">{{ s.total_conductores }}</div>
        <div class="text-xs text-gray-600 font-normal">Total conductores</div>
      </div>
      <div class="w-12 h-12 rounded-full bg-blue-100 flex items-center justify-center flex-shrink-0">
        <svg class="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>
        </svg>
      </div>
    </div>
  </div>

  <!-- Activos -->
  <div class="p-6 bg-white border border-gray-200 rounded-xl shadow-sm hover:shadow-md transition-all duration-300 hover:-translate-y-1 cursor-pointer">
    <div class="flex items-start justify-between">
      <div class="flex flex-col">
        <div class="text-3xl font-bold text-gray-900 mb-1">{{ s.conductores_activos }}</div>
        <div class="text-xs text-gray-600 font-normal">Activos</div>
      </div>
      <div class="w-12 h-12 rounded-full bg-green-100 flex items-center justify-center flex-shrink-0">
        <svg class="w-6 h-6 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>
        </svg>
      </div>
    </div>
  </div>

  <!-- Con bus -->
  <div class="p-6 bg-white border border-gray-200 rounded-xl shadow-sm hover:shadow-md transition-all duration-300 hover:-translate-y-1 cursor-pointer">
    <div class="flex items-start justify-between">
      <div class="flex flex-col">
        <div class="text-3xl font-bold text-gray-900 mb-1">{{ s.conductores_con_bus }}</div>
        <div class="text-xs text-gray-600 font-normal">Con bus</div>
      </div>
      <div class="w-12 h-12 rounded-full bg-purple-100 flex items-center justify-center flex-shrink-0">
        <svg class="w-6 h-6 text-purple-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <rect x="3" y="6" width="18" height="10" rx="2" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>
          <circle cx="8" cy="19" r="2" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>
          <circle cx="16" cy="19" r="2" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>
        </svg>
      </div>
    </div>
  </div>

  <!-- Licencias por vencer (resalta si > 0) -->
  <div class="p-6 border rounded-xl shadow-sm hover:shadow-md transition-all duration-300 hover:-translate-y-1 cursor-pointer"
    [ngClass]="s.licencias_por_vencer > 0 ? 'bg-amber-50 border-amber-300' : 'bg-white border-gray-200'">
    <div class="flex items-start justify-between">
      <div class="flex flex-col">
        <div class="text-3xl font-bold text-gray-900 mb-1">{{ s.licencias_por_vencer }}</div>
        <div class="text-xs text-gray-600 font-normal">Licencias por vencer</div>
      </div>
      <div class="w-12 h-12 rounded-full flex items-center justify-center flex-shrink-0"
        [ngClass]="s.licencias_por_vencer > 0 ? 'bg-amber-200' : 'bg-orange-100'">
        <svg class="w-6 h-6" [ngClass]="s.licencias_por_vencer > 0 ? 'text-amber-700' : 'text-orange-600'" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>
        </svg>
      </div>
    </div>
  </div>

  <!-- Licencias vencidas -->
  <div *ngIf="s.licencias_vencidas > 0" class="p-6 bg-red-50 border border-red-300 rounded-xl shadow-sm hover:shadow-md transition-all duration-300 hover:-translate-y-1 cursor-pointer">
    <div class="flex items-start justify-between">
      <div class="flex flex-col">
        <div class="text-3xl font-bold text-gray-900 mb-1">{{ s.licencias_vencidas }}</div>
        <div class="text-xs text-red-700 font-normal">Licencias vencidas</div>
      </div>
      <div class="w-12 h-12 rounded-full bg-red-200 flex items-center justify-center flex-shrink-0">
        <svg class="w-6 h-6 text-red-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>
        </svg>
      </div>
    </div>
  </div>

  <!-- Inactivos -->
  <div *ngIf="s.conductores_inactivos > 0" class="p-6 bg-white border border-gray-200 rounded-xl shadow-sm hover:shadow-md transition-all duration-300 hover:-translate-y-1 cursor-pointer">
    <div class="flex items-start justify-between">
      <div class="flex flex-col">
        <div class="text-3xl font-bold text-gray-900 mb-1">{{ s.conductores_inactivos }}</div>
        <div class="text-xs text-gray-600 font-normal">Inactivos</div>
      </div>
      <div class="w-12 h-12 rounded-full bg-gray-100 flex items-center justify-center flex-shrink-0">
        <svg class="w-6 h-6 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728A9 9 0 015.636 5.636m12.728 12.728L5.636 5.636" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>
        </svg>
      </div>
    </div>
  </div>

  <!-- Suspendidos -->
  <div *ngIf="s.conductores_suspendidos > 0" class="p-6 bg-white border border-gray-200 rounded-xl shadow-sm hover:shadow-md transition-all duration-300 hover:-translate-y-1 cursor-pointer">
    <div class="flex items-start justify-between">
      <div class="flex flex-col">
        <div class="text-3xl font-bold text-gray-900 mb-1">{{ s.conductores_suspendidos }}</div>
        <div class="text-xs text-gray-600 font-normal">Suspendidos</div>
      </div>
      <div class="w-12 h-12 rounded-full bg-yellow-100 flex items-center justify-center flex-shrink-0">
        <svg class="w-6 h-6 text-yellow-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path d="M10 9v6m4-6v6m7-3a9 9 0 11-18 0 9 9 0 0118 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>
        </svg>
      </div>
    </div>
  </div>
</div>
