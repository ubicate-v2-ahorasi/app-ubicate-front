<div *ngIf="isVisible" class="fixed inset-0 overflow-y-auto h-full w-full z-50 flex items-center justify-center p-4">
  <div class="bg-white w-full max-w-4xl shadow-2xl rounded-xl border border-gray-200">

    <!-- Header del Modal -->
    <div class="flex justify-between items-center px-8 py-6 border-b border-gray-200">
      <h3 class="text-xl font-semibold text-gray-900">{{ isEditMode ? 'Editar Conductor' : 'Nuevo Conductor' }}</h3>
      <button (click)="cancel()" class="text-gray-400 hover:text-gray-600 transition-colors">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <!-- Formulario -->
    <form [formGroup]="conductorForm" (ngSubmit)="onSubmit()" class="px-8 py-6 space-y-6">

      <!-- Información Personal -->
      <div class="mb-8">
        <h4 class="text-lg font-medium text-gray-900 mb-6 flex items-center">
          <svg class="w-5 h-5 mr-2 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
          </svg>
          Información Personal
        </h4>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Nombres *</label>
            <input type="text" formControlName="nombre" placeholder="Juan Carlos"
              class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all" />
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Apellidos *</label>
            <input type="text" formControlName="apellido" placeholder="Pérez García"
              class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all" />
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">DNI *</label>
            <input type="text" formControlName="dni" placeholder="12345678" maxlength="8"
              class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all" />
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Teléfono *</label>
            <input type="tel" formControlName="telefono" placeholder="987654321"
              class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all" />
          </div>

          <div class="md:col-span-2">
            <label class="block text-sm font-medium text-gray-700 mb-2">Email *</label>
            <input type="email" formControlName="email" placeholder="conductor@email.com"
              class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all" />
          </div>
        </div>
      </div>

      <!-- Información de Licencia -->
      <div class="mb-8">
        <h4 class="text-lg font-medium text-gray-900 mb-6 flex items-center">
          <svg class="w-5 h-5 mr-2 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
          </svg>
          Información de Licencia
        </h4>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Número de Licencia *</label>
            <input type="text" formControlName="numeroLicencia" placeholder="A3c-12345678"
              class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all" />
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Categoría *</label>
            <select formControlName="categoriaLicencia"
              class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all">
              <option value="">Seleccionar categoría</option>
              <option *ngFor="let categoria of categorias" [value]="categoria">{{ categoria }}</option>
            </select>
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Fecha de Vencimiento *</label>
            <input type="date" formControlName="fechaVencimientoLicencia"
              class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all" />
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Turno *</label>
            <select formControlName="turno"
              class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all">
              <option *ngFor="let turno of turnos" [value]="turno.value">{{ turno.label }}</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Botones -->
      <div class="flex justify-end space-x-4 pt-6 border-t border-gray-200">
        <button type="button" (click)="cancel()" [disabled]="isSubmitting"
          class="px-6 py-3 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
          Cancelar
        </button>
        <button type="submit" [disabled]="conductorForm.invalid || isSubmitting"
          class="px-6 py-3 text-sm font-medium text-white bg-blue-600 border border-transparent rounded-lg hover:bg-blue-700 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
          {{ isSubmitting ? 'Guardando...' : (isEditMode ? 'Actualizar' : 'Guardar') }}
        </button>
      </div>
    </form>
  </div>
</div>
